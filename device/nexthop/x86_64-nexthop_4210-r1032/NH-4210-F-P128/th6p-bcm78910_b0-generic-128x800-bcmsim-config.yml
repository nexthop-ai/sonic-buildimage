# NH-4210 (TH6P BCM78910) 128x800G BCMSIM port configuration.
#
# Generated from nh4210-r0011-128x800-M_1x100.yaml with the following changes
# (same transformation applied to NH-4220's th6c-bcm78914 bcmsim config):
#   - Removed: PC_PM_CORE (hardware lane maps / polarity — no PHY in simulator)
#   - Removed: PC_TX_TAPS (hardware TX pre-emphasis — no SerDes in simulator)
#   - Modified bcm_device.0.global:
#       pktio_mode: 1 -> 0  (simulator uses internal pktio, not hardware DMA)
#       removed sai_ip_counter_cstats (not present in NH-4220 BCMSIM config)
#       sai_stats_support_mask: 0x80 -> 0 (no hardware queue drop counters in sim)
#
# configuration yaml file
#   device:
#       <unit>:
#           <table>:
#               ?
#                   <key_fld_1>: <value>
#                   ...
#               :
#                   <data_fld_1>: <value>
#                   ...
#

---
bcm_device:
    0:
        global:
            pktio_mode: 0
            vlan_flooding_l2mc_num_reserved: 0
            ipv6_lpm_128b_enable: 1
            shared_block_mask_section: uc_bc
            skip_protocol_default_entries: 1
            # LTSW uses value 1 for ALPM combined mode
            l3_alpm_template: 1
            l3_alpm_hit_skip: 1
            sai_feat_tail_timestamp : 0
            sai_port_phy_time_sync_en : 1
            sai_field_group_auto_prioritize: 1
            #l3_intf_vlan_split_egress for MTU at L3IF
            l3_intf_vlan_split_egress : 1
            pfc_deadlock_seq_control : 0
            sai_pfc_dlr_init_capability: 2
            bcm_tunnel_term_compatible_mode: 1
            l3_ecmp_member_first_lkup_mem_size: 32768
            #enable port queue drop stats
            sai_stats_support_mask: 0
            #disable vxlan tunnel stats
            sai_stats_disable_mask: 0x200
            #For PPIU Mode, Set resources for counters in global mode counters like ACL, etc
            global_flexctr_ing_action_num_reserved: 20
            global_flexctr_ing_pool_num_reserved: 8
            global_flexctr_ing_op_profile_num_reserved: 20
            global_flexctr_ing_group_num_reserved: 2
            global_flexctr_egr_action_num_reserved: 8
            global_flexctr_egr_pool_num_reserved: 5
            global_flexctr_egr_op_profile_num_reserved: 10
            global_flexctr_egr_group_num_reserved: 1
            l3_alpm_large_vrf_mode: 1
            l3_ecmp_member_secondary_mem_size: 8192
            stat_custom_receive0_management_mode: 1
            #srv6:0x10 ipinip:0x2
            sai_tunnel_support : 0x12
