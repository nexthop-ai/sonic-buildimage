[Unit]
Requires=config-setup.service
After=config-setup.service
After=interfaces-config.service
BindsTo=sonic.target
After=sonic.target
# Never give up: a persistent failure must still recover on its own once the
# config is fixed.
StartLimitIntervalSec=0

[Service]
ExecStartPre=!/usr/bin/chrony-config.sh
ExecStart=
ExecStart=!/usr/local/sbin/chronyd-starter.sh
ProtectControlGroups=no
ProcSubset=all
# systemd does not restart a unit it stopped itself, so this does not fight the
# sonic.target teardown.
Restart=always
RestartSec=2s
RestartSteps=5
RestartMaxDelaySec=60s

[Install]
WantedBy=
WantedBy=sonic.target
